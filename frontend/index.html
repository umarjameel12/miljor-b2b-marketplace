<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MilJor — Collective B2B Food Procurement Marketplace. Group demand, unlock wholesale value. Milkar Khareedo, Behtar Pao." />
    <title>MilJor — Collective Food Procurement</title>

    <!-- Typography: Playfair Display (Editorial Serif Headlines) & Inter (Interface / Sans / Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Theme Script (Synchronous execution before DOM paint) -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeParam = params.get('theme');
          var stored = themeParam || localStorage.getItem('miljor_theme') || 'system';
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
