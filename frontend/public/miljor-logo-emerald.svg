<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle radial vignette -->
    <radialGradient id="emBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0F4738"/>
      <stop offset="60%" stop-color="#072A21"/>
      <stop offset="100%" stop-color="#03140F"/>
    </radialGradient>

    <!-- Border luxury gradient -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8BE78" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A87B3C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FCE6B7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Monogram Gradients -->
    <linearGradient id="emStemLeft" x1="6" y1="44" x2="33" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A87B3C"/>
      <stop offset="20%" stop-color="#C99B56"/>
      <stop offset="50%" stop-color="#E8BE78"/>
      <stop offset="80%" stop-color="#FCE6B7"/>
      <stop offset="100%" stop-color="#FFF8E0"/>
    </linearGradient>

    <linearGradient id="emFoldLeft" x1="31" y1="7" x2="50" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="18%" stop-color="#EABC75"/>
      <stop offset="50%" stop-color="#AF7C3B"/>
      <stop offset="80%" stop-color="#7A4F1D"/>
      <stop offset="100%" stop-color="#5E3B12"/>
    </linearGradient>

    <linearGradient id="emTroughWave" x1="46" y1="36" x2="69" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#936428"/>
      <stop offset="25%" stop-color="#C59652"/>
      <stop offset="60%" stop-color="#EABF77"/>
      <stop offset="88%" stop-color="#FCE5B5"/>
      <stop offset="100%" stop-color="#FFF8E2"/>
    </linearGradient>

    <linearGradient id="emTailRight" x1="71" y1="7" x2="95" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E2"/>
      <stop offset="22%" stop-color="#EABC77"/>
      <stop offset="55%" stop-color="#C59754"/>
      <stop offset="85%" stop-color="#9A6B2F"/>
      <stop offset="100%" stop-color="#784E1C"/>
    </linearGradient>

    <linearGradient id="emSpecular" x1="20" y1="6" x2="80" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#EABC77" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Luxury Typography Gradient -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFF6DD"/>
      <stop offset="45%" stop-color="#E8BF7B"/>
      <stop offset="100%" stop-color="#C89A55"/>
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Emerald Background -->
  <rect width="1200" height="630" fill="url(#emBg)"/>

  <!-- Inner Elegant Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="52" y="52" width="1096" height="526" rx="16" fill="none" stroke="#C8B276" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Scaled Master Ribbon-M Monogram -->
  <g transform="translate(370, 115) scale(4.45)" filter="url(#monogramGlow)">
    <!-- Facet 1 -->
    <path
      d="M 6.0 44.5 C 7.0 41.0, 9.8 32.0, 13.5 23.5 C 17.0 15.5, 22.8 9.0, 29.8 7.0 C 33.0 6.4, 36.5 7.0, 39.0 8.8 C 40.5 11.5, 39.0 16.0, 35.0 21.5 C 30.0 28.0, 23.5 35.5, 17.5 40.5 C 13.0 43.5, 8.5 45.0, 6.0 44.5 Z"
      fill="url(#emStemLeft)"
    />
    <!-- Facet 2 -->
    <path
      d="M 31.0 7.0 C 34.5 6.6, 38.0 8.0, 41.5 11.5 C 46.0 16.0, 50.0 21.0, 54.0 23.8 C 54.5 28.0, 52.0 34.5, 47.5 37.5 C 42.5 34.0, 37.5 27.0, 33.0 20.0 C 29.0 14.0, 28.5 8.5, 31.0 7.0 Z"
      fill="url(#emFoldLeft)"
    />
    <!-- Facet 3 -->
    <path
      d="M 45.0 36.0 C 49.0 38.8, 52.5 40.4, 55.0 40.0 C 59.5 38.5, 63.8 33.5, 68.0 26.0 C 71.5 19.0, 73.5 11.5, 71.0 7.0 C 67.5 7.2, 64.0 12.0, 60.0 18.0 C 55.5 25.0, 51.0 31.0, 45.0 36.0 Z"
      fill="url(#emTroughWave)"
    />
    <!-- Facet 4 -->
    <path
      d="M 70.0 7.0 C 73.5 6.5, 77.0 8.5, 80.0 12.5 C 84.5 18.0, 88.5 26.5, 92.0 34.0 C 94.0 39.0, 95.5 43.0, 95.0 44.2 C 93.8 45.0, 89.8 43.8, 86.0 40.8 C 81.5 36.5, 76.0 29.5, 71.5 22.0 C 67.5 15.0, 67.0 8.5, 70.0 7.0 Z"
      fill="url(#emTailRight)"
    />
    <!-- Specular Ridge Highlights -->
    <path
      d="M 17.5 16.5 C 22.5 9.5, 27.0 7.0, 31.5 7.0 C 35.0 7.0, 39.5 9.0, 44.0 14.5"
      stroke="url(#emSpecular)"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.9"
    />
    <path
      d="M 64.5 14.5 C 67.5 9.5, 70.0 7.0, 72.0 7.0 C 75.0 7.0, 79.5 10.0, 84.5 17.5"
      stroke="url(#emSpecular)"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- Typography: Wordmark in Playfair Display serif -->
  <text x="600" y="440" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" letter-spacing="14" fill="url(#goldText)" text-anchor="middle">
    MILJOR
  </text>

  <!-- Divider Line with Diamond -->
  <line x1="430" y1="475" x2="570" y2="475" stroke="#C8B276" stroke-opacity="0.4" stroke-width="1"/>
  <polygon points="600,471 604,475 600,479 596,475" fill="#E8BE78"/>
  <line x1="630" y1="475" x2="770" y2="475" stroke="#C8B276" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Sub-caption in Inter sans -->
  <text x="600" y="515" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="500" letter-spacing="6" fill="#F7F3E8" fill-opacity="0.75" text-anchor="middle">
    LAHORE B2B COLLECTIVE FOOD PROCUREMENT
  </text>
</svg>
