      fill="url(#ribbon-tail-right)"
    />
    <path
      d="M 17.5 16.5 C 22.5 9.5, 27.0 7.0, 31.5 7.0 C 35.0 7.0, 39.5 9.0, 44.0 14.5"
      stroke="url(#crest-specular)"
      stroke-width="1.1"
      stroke-linecap="round"
      opacity="0.85"
