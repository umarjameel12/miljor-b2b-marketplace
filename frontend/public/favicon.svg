    <path
      d="M 64.5 14.5 C 67.5 9.5, 70.0 7.0, 72.0 7.0 C 75.0 7.0, 79.5 10.0, 84.5 17.5"
      stroke="url(#crest-specular)"
      stroke-width="1.1"
      stroke-linecap="round"
      opacity="0.85"
    />
