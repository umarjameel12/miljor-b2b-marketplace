      fill="url(#ribbon-stem-left)"
    />
    <path
      d="M 31.0 7.0 C 34.5 6.6, 38.0 8.0, 41.5 11.5 C 46.0 16.0, 50.0 21.0, 54.0 23.8 C 54.5 28.0, 52.0 34.5, 47.5 37.5 C 42.5 34.0, 37.5 27.0, 33.0 20.0 C 29.0 14.0, 28.5 8.5, 31.0 7.0 Z"
