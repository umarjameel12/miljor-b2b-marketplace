name: MilJor Morning Demo Preflight Smoke
on:
  pull_request:
    paths:
      - 'backend/scripts/demo_preflight.js'
      - 'backend/tests/demo_preflight_smoke.test.js'
      - '.github/workflows/miljor-demo-preflight.yml'
  push:
    branches:
      - 'fix/morning-demo-readonly-preflight-20261112'
    paths:
      - 'backend/scripts/demo_preflight.js'
      - 'backend/tests/demo_preflight_smoke.test.js'
      - '.github/workflows/miljor-demo-preflight.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and non-destructive isolated HTTP smoke tests
        run: |
          node --check backend/scripts/demo_preflight.js
          node --check backend/tests/demo_preflight_smoke.test.js
          node backend/tests/demo_preflight_smoke.test.js
