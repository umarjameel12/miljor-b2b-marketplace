name: B7 isolated postpurchase source acceptance
on:
  push:
    branches:
      - feature/b7-fulfillment-gap-audit-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked backend dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Check postpurchase service/controller syntax
        run: |
          node --check backend/src/services/disputeService.js
          node --check backend/src/services/fulfillmentService.js
          node --check backend/src/services/invoiceService.js
          node --check backend/src/services/b7AwardInvoiceProjection.js
          node --check backend/src/services/b7LineDeliveryPolicy.js
          node --check backend/src/services/b7PostpurchaseEventBridge.js
          node --check backend/src/services/b7DisputeSupplierPrivacy.js
          node --check backend/tests/b7_dispute_supplier_privacy_gate.js
          node --check backend/tests/b7_invoice_service_mock_gate.js
          node --check backend/tests/b7_dispute_service_mock_gate.js
          node --check backend/src/services/b7InvoiceAudienceProjection.js
          node --check backend/tests/b7_invoice_supplier_privacy_gate.js
          node --check backend/tests/b7_direct_order_event_bridge_gate.js
          node --check backend/tests/b7_postpurchase_business_contract_gate.js
          node --check backend/tests/b7_postpurchase_isolated_acceptance_gate.js
          node --check backend/tests/b7_b6_award_fulfillment_readonly_gate.js
      - name: Run actual isolated B7 business contract assertions
        run: npm --prefix backend run test:b7:source
        env:
          NODE_ENV: test
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Run existing frontend parser/design tests
        run: npm --prefix frontend test
      - name: Build B7 buyer/supplier frontend
        run: npm --prefix frontend run build
      - name: State test limitations
        run: echo "Source/build only; real MySQL, authenticated B6 fixture, dispute lifecycle and browser write E2E require separate isolated acceptance."

  browser-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Install isolated Playwright browser-test runtime
        run: |
          npm --prefix frontend install --no-save --ignore-scripts playwright
          cd frontend
          npx playwright install --with-deps chromium
      - name: Run actual Chromium UI with mock HTTP and isolated data
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/b7-mock-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:5173/post-purchase > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/post-purchase > /dev/null
          B7_VITE_URL=http://127.0.0.1:5173 node tests/b7_postpurchase_mock_browser_gate.mjs
      - name: Clearly state browser-test scope
        if: always()
        run: echo "Chromium UI uses MOCK HTTP; NOT actual MySQL/real paid Safepay/supplier API acceptance."

  mysql-ephemeral-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: b7_only_ephemeral_root
          MYSQL_DATABASE: miljor_test_db
          MYSQL_USER: b7_ci_test
          MYSQL_PASSWORD: b7_only_ephemeral_user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u b7_ci_test -pb7_only_ephemeral_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_NAME: miljor_test_db
      TEST_DB_NAME: miljor_test_db
      DB_HOST: 127.0.0.1
      DB_USER: b7_ci_test
      DB_PASSWORD: b7_only_ephemeral_user
      JWT_SECRET: b7_ephemeral_ci_disposable_only_jwt_secret_never_real
      B7_CI_EPHEMERAL_DB: 'YES'
      B7_ALLOW_ISOLATED_POSTPURCHASE_TESTS: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Bootstrap ONLY fresh temporary miljor_test_db, apply original migrations and verify identity
        run: node backend/tests/b7_ci_ephemeral_db_bootstrap.js
      - name: Seed original B6 supplier SKU fixtures in ephemeral DB
        run: node backend/database/seed_b6_fixtures.js
      - name: Seed explicit synthetic paid-state B6 award fixtures (NOT Safepay)
        run: node backend/tests/b7_ci_seed_award_fixtures.js
      - name: Execute B7 real Express HTTP + MySQL 8 + invoice + physical SKU dispute acceptance
        run: node backend/tests/b7_ci_real_mysql_http_gate.js
      - name: Attempt legacy Part4E4/4E5 regression with protected DB reads denied
        id: legacy_guard
        continue-on-error: true
        run: npm --prefix backend run test:b7:isolated
      - name: Report legacy protected-DB fingerprint blocker explicitly
        if: always()
        run: echo "Legacy regression gate can fail on prohibited SELECT miljor_db.*. Never grant access to protected DB just to make tests pass; dedicated B7 real MySQL HTTP gate executes independently."
      - name: State limitation
        if: always()
        run: echo "Ephemeral MySQL suite does not prove provider-verified paid B6 award, live Safepay, global migrations, or actual user browser WRITE E2E."
