name: Smart Hub notification contracts
on:
  pull_request:
    paths:
      - 'backend/src/services/*notification*'
      - 'backend/src/services/procurement*'
      - 'backend/src/services/supplierOperationsService.js'
      - 'backend/src/services/catalogService.js'
      - 'backend/src/services/specificationService.js'
      - 'backend/tests/spec_code_collision_retry.test.js'
      - 'backend/src/services/safepayAdapter.js'
      - 'backend/src/services/safepayCheckoutService.js'
      - 'backend/tests/safepay_payment_created_webhook.test.js'
      - 'backend/src/services/fulfillmentService.js'
      - 'backend/src/routes/v1/supplierRoutes.js'
      - 'backend/tests/supplier_operations*'
      - 'frontend/src/components/supplier/**'
      - 'frontend/src/api/supplierFulfillment.js'
      - 'frontend/src/pages/SupplierDashboardPage.jsx'
      - 'frontend/src/pages/OrdersPage.jsx'
      - 'frontend/tests/supplier_fulfillment.test.js'
      - 'backend/src/services/emailService.js'
      - 'backend/src/routes/v1/notificationRoutes.js'
      - 'backend/database/migrations/09*.sql'
      - 'backend/tests/notification*'
      - 'backend/tests/email_outbox_queue_gate.js'
      - 'frontend/src/api/notifications.js'
      - 'frontend/src/components/layout/AppShell.jsx'
      - 'frontend/tests/notifications.test.js'
      - '.github/workflows/smart-hub-notifications.yml'
  push:
    branches: ['feature/smart-procurement-hub-unified-entry']
jobs:
  notification-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: npm ci
      - name: Notification service, action and channel contracts
        run: |
          node --test tests/notification_projection_gate.js tests/notification_request_action_gate.js tests/email_outbox_queue_gate.js tests/fulfillment_notification_hooks.test.js tests/financial_notification_action_gate.js
          node tests/notification_transaction_gate.js
          node tests/notification_route_ownership_gate.js
          node tests/canonical_migration_manifest_gate.js
          node tests/procurement_delivery_binding_policy_gate.js
          node --test tests/supplier_operations_overview_gate.js
          node --test tests/recurring_cycle_inputs_policy_gate.js
          node --test tests/collective_commitment_policy_gate.js
          node --test tests/spec_code_collision_retry.test.js
          node --test tests/safepay_payment_created_webhook.test.js
          node --test tests/individual_delivery_pricing.test.js tests/procurement_settlement_review_policy.test.js tests/delivery_payment_recovery_policy.test.js tests/smart_hub_paid_browser_provider_readiness.test.js
          node --test tests/procurement_delivery_run_policy_gate.js tests/procurement_delivery_evidence.test.js tests/procurement_line_receipt_policy.test.js tests/procurement_line_receipt_transactions.test.js tests/procurement_line_receipt_api.test.js tests/procurement_line_receipt_financial.test.js tests/procurement_reporting_service_gate.js tests/procurement_reporting_routes_gate.js
          node tests/b6_recurring_worker_gate.js
      - name: Install frontend
        run: npm ci --prefix ../frontend
      - name: Polling, account isolation and durable read tests
        working-directory: frontend
        run: node --test tests/notifications.test.js tests/supplier_fulfillment.test.js
      - name: Frontend build
        working-directory: frontend
        run: npm run build
